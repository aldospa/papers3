; PlatformIO Project Configuration File for M5PaperS3 Dashboard Controller
;
; This file is optional. The sketch can be compiled using Arduino IDE.
; For PlatformIO users, this provides build configuration.

[env:m5stack-paper]
platform = espressif32
board = m5stack-paper
framework = arduino

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    colorize
    time

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Library dependencies
lib_deps = 
    m5stack/M5Unified@^0.1.13
    m5stack/M5SwitchC6@^0.0.1
    knolleary/PubSubClient@^2.8

; Upload configuration
upload_speed = 921600

; Partition scheme for larger applications
board_build.partitions = default.csv
